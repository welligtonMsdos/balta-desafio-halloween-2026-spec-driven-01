services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=auth;Username=auth;Password=auth
      Jwt__Issuer: auth-api
      Jwt__Audience: auth-api-clients
      Jwt__Key: development-only-jwt-key-with-at-least-32-bytes
      Jwt__ExpiresInMinutes: 60
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
